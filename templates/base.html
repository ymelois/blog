<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="description" content="{{ config.description }}" />
        <title>{{ config.title }}</title>
        <link
            rel="stylesheet"
            href="{{ get_url(path='giallo-light.css') | safe }}"
            media="screen and (prefers-color-scheme: light)"
        />
        <link
            rel="stylesheet"
            href="{{ get_url(path='giallo-dark.css') | safe }}"
            media="screen and (prefers-color-scheme: dark)"
        />
        <style>
            :root {
                color-scheme: light dark;

                --background: #fdfdfd;
                --foreground: #111111;
                --link: #005fcc;
                --visited-link: #6b368f;
                --focus: #b44c00;
                --subtle-background: #eeeeee;
                --border: #767676;
            }

            *,
            *::before,
            *::after {
                box-sizing: border-box;
            }

            body {
                max-width: 65ch;
                margin: 1em auto;
                padding: 0 1em 3em;

                color: var(--foreground);
                background: var(--background);

                font-family:
                    system-ui,
                    -apple-system,
                    BlinkMacSystemFont,
                    "Segoe UI",
                    sans-serif;
                font-size: 1.125rem;
                line-height: 1.65;
            }

            a {
                color: var(--link);
                overflow-wrap: anywhere;
                text-decoration-thickness: 0.08em;
                text-underline-offset: 0.15em;
            }

            a:visited {
                color: var(--visited-link);
            }

            a:hover {
                text-decoration-thickness: 0.14em;
            }

            a:focus-visible {
                border-radius: 0.1em;
                outline: 0.18em solid var(--focus);
                outline-offset: 0.18em;
            }

            h1,
            h2,
            h3 {
                line-height: 1.2;
                overflow-wrap: break-word;
            }

            h1 {
                margin-block: 1em 0.6em;
            }

            h2,
            h3 {
                margin-block: 1.5em 0.5em;
            }

            p,
            ul,
            ol,
            blockquote,
            pre,
            table {
                margin-block: 1em;
            }

            li + li {
                margin-top: 0.25em;
            }

            :not(pre) > code {
                padding: 0.1em 0.3em;
                border-radius: 0.2em;
                background: var(--subtle-background);
            }

            pre {
                max-width: 100%;
                padding: 1em;
                overflow-x: auto;
                border-radius: 0.35em;
                line-height: 1.45;
                tab-size: 4;
            }

            code {
                font-size: 0.9em;
            }

            blockquote {
                margin-inline: 0;
                padding-inline-start: 1em;
                border-inline-start: 0.25em solid var(--border);
            }

            table {
                width: 100%;
                border-collapse: collapse;
            }

            th,
            td {
                padding: 0.4em 0.65em;
                border: 1px solid var(--border);
                text-align: start;
                vertical-align: top;
            }

            img,
            svg,
            video {
                display: block;
                max-width: 100%;
                height: auto;
            }

            .giallo-l {
                display: inline-block;
                width: 100%;
                min-height: 1lh;
            }

            .giallo-ln {
                display: inline-block;
                min-width: 3ch;
                margin-right: 0.4em;
                padding: 0.4em;
                text-align: right;
                user-select: none;
                opacity: 0.8;
            }

            @media (prefers-color-scheme: dark) {
                :root {
                    --background: #111111;
                    --foreground: #fdfdfd;
                    --link: #75baff;
                    --visited-link: #d7a8ff;
                    --focus: #ffbf47;
                    --subtle-background: #292929;
                    --border: #666666;
                }
            }

            @media print {
                :root {
                    color-scheme: light;
                    --background: #ffffff;
                    --foreground: #000000;
                    --link: #000000;
                    --visited-link: #000000;
                    --subtle-background: #eeeeee;
                    --border: #777777;
                }

                body {
                    max-width: none;
                    padding: 0;
                    font-size: 11pt;
                }
            }
        </style>
    </head>
    <body>
        {% block content %} {% endblock content %}
    </body>
</html>
