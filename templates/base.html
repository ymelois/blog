<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="description" content="{{ config.description }}" />
        <title>{{ config.title }}</title>
        <style>
            body {
                margin: 1em auto;
                max-width: 40em;
                padding: 0 0.62em 3.24em;
                font: 1.2em/1.62 sans-serif;
                color: #111111;
                background: #fdfdfd;
            }
            @media (prefers-color-scheme: dark) {
                body {
                    color: #fdfdfd;
                    background: #111111;
                }
            }
            h1,
            h2,
            h3 {
                line-height: 1.2;
            }
            @media print {
                body {
                    max-width: none;
                }
            }
        </style>
    </head>
    <body>
        {% block content %} {% endblock content %}
    </body>
</html>
