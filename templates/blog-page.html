{% extends "base.html" %}
{% block title %}{{ page.title }} | {{ config.title }}{% endblock %}
{% block description %}{{ page.description | default(value=config.description) }}{% endblock %}
{% block content %}
<main>
    <article>
        <h1>{{ page.title }}</h1>
        <p><time datetime="{{ page.date }}">{{ page.date }}</time></p>
        {{ page.content | safe }}
    </article>
</main>
{% endblock content %}
